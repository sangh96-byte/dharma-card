<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FAF6EE" />
  <title>🪷 오늘의 불경 말씀</title>
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/fonts.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: #ECE4D7;
      font-family: var(--font-ui);
      color: #26221D;
      overflow: hidden;
    }
    .single-shell {
      position: relative;
      width: 100%;
      height: 100dvh;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      background: #FAF6EE;
      box-shadow: 0 24px 70px rgba(45, 33, 18, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    @media (max-width: 520px) {
      .single-shell { max-width: 100%; box-shadow: none; }
    }
    .bg-layer {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      z-index: 0;
      animation: softReveal 1.1s ease-out;
    }
    @keyframes softReveal {
      from { opacity: 0.4; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }
    .bg-glow {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 86% 64% at 50% 48%, rgba(255,253,248,0.84) 0%, rgba(255,251,243,0.46) 62%, rgba(255,251,243,0.04) 100%);
      z-index: 1; pointer-events: none;
    }
    .hanji-frame {
      position: absolute; inset: 16px;
      border: 1px solid rgba(168, 140, 102, 0.30);
      border-radius: 16px; z-index: 2; pointer-events: none;
    }
    .native-save-overlay {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.001; z-index: 4;
      -webkit-touch-callout: default; user-select: none;
    }
    .card-center {
      position: relative; z-index: 3; width: 100%;
      padding: 36px 32px 64px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; user-select: none; pointer-events: none;
      animation: fadeUp 0.9s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bell-emblem { width: 24px; height: 30px; margin-bottom: 10px; opacity: 0.8; }
    .quote-number {
      font-family: var(--font-expo-classic); font-size: 14px;
      letter-spacing: 0.22em; color: #7D6A54; margin-bottom: 26px;
    }
    .quote-text {
      white-space: pre-line; word-break: keep-all; max-width: 100%;
      line-height: 1.85; text-shadow: 0 1px 14px rgba(255, 253, 248, 0.88);
    }
    .size-small { font-size: clamp(18px, 4.6vw, 21px); }
    .size-medium { font-size: clamp(21px, 5.5vw, 25px); }
    .size-large { font-size: clamp(24px, 6.3vw, 29px); }
    .size-xlarge { font-size: clamp(27px, 7.1vw, 33px); }
    .font-expo-calli.size-small { font-size: clamp(21px, 5.3vw, 25px); }
    .font-expo-calli.size-medium { font-size: clamp(25px, 6.4vw, 30px); }
    .font-expo-calli.size-large { font-size: clamp(29px, 7.3vw, 35px); }
    .font-expo-calli.size-xlarge { font-size: clamp(32px, 8.1vw, 39px); }
    .font-expo-ink.size-small { font-size: clamp(24px, 6.1vw, 29px); }
    .font-expo-ink.size-medium { font-size: clamp(28px, 7.1vw, 34px); }
    .font-expo-ink.size-large { font-size: clamp(32px, 8.1vw, 39px); }
    .font-expo-ink.size-xlarge { font-size: clamp(36px, 8.9vw, 43px); }
    .quote-text.long-quote { font-size: 0.88em; }
    .quote-source-row {
      margin-top: 30px; display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-expo-classic); font-size: 16.5px; color: #5C4E3D; letter-spacing: 0.08em;
    }
    .music-float {
      position: absolute; left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 12px) + 26px);
      transform: translateX(-50%); z-index: 10;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px; border-radius: 999px;
      background: rgba(255, 252, 246, 0.78); backdrop-filter: blur(10px);
      border: 1px solid rgba(168, 140, 102, 0.30);
      color: #544432; font-size: 12.5px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(68, 48, 24, 0.08);
      transition: all 0.25s ease;
    }
    .music-float.playing {
      background: rgba(102, 78, 52, 0.82); color: #FAF6EE; border-color: rgba(102, 78, 52, 0.5);
    }
    .music-float.pulse { animation: softPulse 2.2s infinite; }
    @keyframes softPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(168, 130, 82, 0.38); }
      50% { box-shadow: 0 0 0 9px rgba(168, 130, 82, 0); }
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #B88B58; }
    .music-float.playing .dot { background: #F4D59D; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="single-shell">
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-glow"></div>
    <div class="hanji-frame"></div>
    <img class="native-save-overlay" id="nativeSaveImg" alt="오늘의 불경 법문 카드" />

    <main class="card-center">
      <svg class="bell-emblem" id="bellEmblem" viewBox="0 0 36 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="1" width="4" height="7" rx="2" fill="#4C3E30"/>
        <path d="M18 7C10.5 7 7 15 6 35H30C29 15 25.5 7 18 7Z" fill="#4C3E30"/>
        <rect x="4" y="34" width="28" height="3.5" rx="1.7" fill="#4C3E30"/>
      </svg>
      <div class="quote-number" id="quoteNumber"></div>
      <div class="quote-text font-expo-woodblock size-medium ink-charcoal" id="quoteText"></div>
      <div class="quote-source-row">
        <span id="quoteSource"></span>
        <span class="dharma-seal" id="dharmaSeal">法</span>
      </div>
    </main>

    <button class="music-float" id="musicBtn" type="button">
      <span class="dot"></span>
      <span id="musicLabel">🎵 불교 명상 음악 준비 중...</span>
    </button>
  </div>

  <script src="./js/soundEngine.js"></script>
  <script src="./js/cardCanvas.js"></script>
  <script>
    (function () {
      const THEME_TO_BG = {
        '보시': ['bg-01.jpg', 'bg-08.jpg'],
        '비움': ['bg-02.jpg', 'bg-06.jpg'],
        '수행': ['bg-03.jpg', 'bg-09.jpg'],
        '지혜': ['bg-05.jpg', 'bg-10.jpg'],
        '자비': ['bg-07.jpg', 'bg-11.jpg'],
        '언어': ['bg-04.jpg', 'bg-12.jpg'],
        '평온': ['bg-12.jpg', 'bg-06.jpg'],
      };
      const ALL_BGS = [
        'bg-01.jpg','bg-02.jpg','bg-03.jpg','bg-04.jpg','bg-05.jpg','bg-06.jpg',
        'bg-07.jpg','bg-08.jpg','bg-09.jpg','bg-10.jpg','bg-11.jpg','bg-12.jpg',
      ];

      const el = {
        bgLayer: document.getElementById('bgLayer'),
        nativeSaveImg: document.getElementById('nativeSaveImg'),
        bellEmblem: document.getElementById('bellEmblem'),
        quoteNumber: document.getElementById('quoteNumber'),
        quoteText: document.getElementById('quoteText'),
        quoteSource: document.getElementById('quoteSource'),
        dharmaSeal: document.getElementById('dharmaSeal'),
        musicBtn: document.getElementById('musicBtn'),
        musicLabel: document.getElementById('musicLabel'),
      };

      let audioCfg = { enabled: true, track: 'singing_bowl', autoplay: true, volume: 65 };
      let pendingUnlock = false;

      function resolveBg(card, design, availableBgs) {
        const list = (availableBgs && availableBgs.length > 0) ? availableBgs : ALL_BGS;
        if (card.customBgId && list.includes(card.customBgId)) return card.customBgId;
        const mode = (design && design.bgMode) || 'theme';
        if (mode === 'fixed' && design.fixedBgId && list.includes(design.fixedBgId)) return design.fixedBgId;
        if (mode === 'theme') {
          const cands = (THEME_TO_BG[card.theme] || []).filter((id) => list.includes(id));
          if (cands.length > 0) return cands[(card.id || 0) % cands.length];
        }
        return list[Math.abs((card.sortOrder || card.id || 1) - 1) % list.length];
      }

      function updateMusicUi() {
        const playing = window.DharmaSoundEngine.isPlaying();
        const name = window.DharmaSoundEngine.getTrackLabel(audioCfg.track);
        el.musicBtn.classList.toggle('playing', playing);
        el.musicBtn.classList.toggle('pulse', !playing && pendingUnlock);
        if (audioCfg.track === 'mute') {
          el.musicBtn.classList.add('hidden');
          return;
        }
        if (playing) {
          el.musicLabel.textContent = '🎵 ' + name + ' · 일시정지';
        } else if (pendingUnlock) {
          el.musicLabel.textContent = '🪷 화면을 터치하면 명상 음악이 흐릅니다';
        } else {
          el.musicLabel.textContent = '🎵 ' + name + ' 듣기 ▶';
        }
      }

      window.DharmaSoundEngine.onChange(updateMusicUi);

      el.musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        pendingUnlock = false;
        if (window.DharmaSoundEngine.isPlaying()) {
          window.DharmaSoundEngine.stop();
        } else {
          window.DharmaSoundEngine.start(audioCfg.track, Math.max(audioCfg.volume || 60, 55));
        }
        updateMusicUi();
      });

      function unlockAndPlay() {
        if (!pendingUnlock || audioCfg.track === 'mute') return;
        pendingUnlock = false;
        window.DharmaSoundEngine.start(audioCfg.track, Math.max(audioCfg.volume || 60, 55)).then(updateMusicUi);
        window.removeEventListener('pointerdown', unlockAndPlay);
        window.removeEventListener('touchstart', unlockAndPlay);
        window.removeEventListener('click', unlockAndPlay);
      }

      async function init() {
        try {
          const [cfgRes, quotesRes] = await Promise.all([
            fetch('./data/public-config.json?v=' + Date.now(), { cache: 'no-store' }),
            fetch('./data/quotes.json?v=' + Date.now(), { cache: 'no-store' }),
          ]);
          const cfg = await cfgRes.json();
          const quotes = await quotesRes.json();

          const params = new URLSearchParams(window.location.search);
          const reqId = Number(params.get('id') || params.get('card'));
          const targetId = reqId || cfg.todayCardId || (quotes[0] && quotes[0].id) || 1;
          const card = quotes.find((q) => Number(q.id) === targetId) || quotes[0];
          if (!card) throw new Error('말씀을 찾을 수 없습니다.');

          const d = cfg.design || {};
          audioCfg = { ...audioCfg, ...(cfg.audio || {}) };
          const bgId = resolveBg(card, d, cfg.backgrounds);
          const bgTxtName = bgId.replace(/.[^.]+$/, '.data.txt');
          let bgUrl = './backgrounds/' + encodeURIComponent(bgId);
          try {
            const bgRes = await fetch('./backgrounds/' + encodeURIComponent(bgTxtName));
            if (bgRes.ok) {
              const txt = (await bgRes.text()).trim();
              if (txt.startsWith('data:image/')) bgUrl = txt;
            }
          } catch {}

          document.title = '🪷 오늘의 법문 · ' + card.source;
          el.bgLayer.style.backgroundImage = 'url("' + bgUrl + '")';

          el.bellEmblem.classList.toggle('hidden', d.showIcon === false);
          el.quoteNumber.classList.toggle('hidden', d.showNumber === false);
          el.quoteNumber.textContent = '· ' + card.id + ' ·';

          const lines = (card.quote_ko || '').split('\n');
          const isLong = lines.length >= 6 || (card.quote_ko || '').length > 90;
          el.quoteText.className = [
            'quote-text',
            'font-' + (d.fontPreset || 'expo-woodblock'),
            'size-' + (d.fontSize || 'medium'),
            'ink-' + (d.textDarkness || 'charcoal'),
            isLong ? 'long-quote' : '',
          ].join(' ');
          el.quoteText.style.lineHeight = String(d.lineHeight || 1.85);
          el.quoteText.textContent = card.quote_ko;

          el.quoteSource.textContent = '- ' + card.source + ' -';
          el.dharmaSeal.classList.toggle('hidden', d.showSeal === false);
          el.dharmaSeal.textContent = d.sealText || '法';

          // 길게 꾹 눌러서 안드로이드 네이티브 사진 저장이 가능하도록 고화질 PNG 생성 연결
          window.DharmaCardCanvas.renderDharmaCardToBlob(
            { ...card, resolvedBgUrl: bgUrl },
            d,
            { format: 'mobile' }
          ).then((blob) => {
            if (blob) el.nativeSaveImg.src = URL.createObjectURL(blob);
          }).catch(() => {});

          // 배경 불교 명상 음악 재생
          if (audioCfg.enabled !== false && audioCfg.track !== 'mute') {
            window.DharmaSoundEngine.preload(audioCfg.track);
            const started = await window.DharmaSoundEngine.start(audioCfg.track, Math.max(audioCfg.volume || 60, 55));
            if (!started) {
              pendingUnlock = true;
              window.addEventListener('pointerdown', unlockAndPlay, { once: true });
              window.addEventListener('touchstart', unlockAndPlay, { once: true });
              window.addEventListener('click', unlockAndPlay, { once: true });
            }
          }
          updateMusicUi();
        } catch (err) {
          el.quoteText.textContent = '법문 카드를 불러오는 중 오류가 발생했습니다.';
          el.musicBtn.classList.add('hidden');
        }
      }

      init();
    })();
  </script>
</body>
</html>
